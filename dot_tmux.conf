# Extended keys — required for Shift+Enter (newline without submitting) to
# reach Claude Code inside tmux. Server-scoped, so they affect every session on
# this socket.
set -g extended-keys always
set -as terminal-features 'xterm*:extkeys'
set -s extended-keys-format csi-u

# A running server never re-reads this file:
#   tmux source-file ~/.tmux.conf
# and Claude Code negotiates its keyboard mode once at startup, so sessions
# started before the change need restarting.

# --- Based on https://github.com/a-inacio/dotfiles/blob/main/dot_tmux.conf ---
set -g @plugin 'catppuccin/tmux#v2.3.0'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'iarchean/tmux-starship'
set -g @plugin 'tmux-plugins/tpm'

set -g mouse on
set -g set-clipboard on               # use system clipboard

# --- Catppuccin Plugin & Module Configurations ---
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"
# "cc" windows show the pane title Claude Code sets (its task title), cut to 30 chars.
set -g @catppuccin_window_text "#{?#{==:#W,cc},#{=30:pane_title},#W}"
set -g @catppuccin_window_current_text "#{?#{==:#W,cc},#{=30:pane_title},#W}#{?window_zoomed_flag,(),}"
set -g @catppuccin_directory_text "#{b:pane_current_path}"

# --- Native Status Placement & Adjustments ---
set -g status-position top
set -g renumber-windows on            # renumber windows as they are closed
set -g base-index 1                   # start windows index at 1 instead of 0
set -g status-left-length 100
set -g status-right-length 200
set -g status-left "#{E:@catppuccin_status_session}"
# tmux-starship: starship modules for the active pane's directory. Uses the
# same starship.toml as the shell prompt; set here too so it holds when the
# server was started from something other than fish.
set-environment -g STARSHIP_CONFIG "$HOME/.config/starship/starship.toml"
set -g status-interval 5
set -g status-right "#{E:@status_right_extra}#(#{@starship_cmd} git_branch)#(#{@starship_cmd} kubernetes)#{E:@catppuccin_status_directory}#[fg=default,bg=default]"

# Pass the active pane's title (e.g. Claude Code's task title) up to the iTerm tab.
set -g set-titles on
set -g set-titles-string "#T"

# Use vi or emacs-style key bindings in copy and choice modes.
set -g mode-keys vi

# Match Vim's intuitive selection mapping behavior
bind-key -T copy-mode-vi 'v' send -X begin-selection     # Begin selection in copy mode.
bind-key -T copy-mode-vi 'C-v' send -X rectangle-toggle  # Begin selection in copy mode.
bind-key -T copy-mode-vi 'y' send -X copy-selection      # Yank selection in copy mode.

# Use current path
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
# more convenient...
bind | split-window -v -c "#{pane_current_path}"
bind \\ split-window -h -c "#{pane_current_path}"

# Drop-ins from other dotfiles sources layered on top of this one. They can
# fill @status_right_extra (shown first in status-right) or add plugins.
source-file -q ~/.config/tmux/conf.d/*.conf

# Install declared plugins on first launch if missing, then reload so they load
# this session (tpm's auto-install is async — without the reload the theme only
# appears on the *next* launch). chezmoi clones tpm itself (.chezmoiexternal).
if "test ! -d ~/.tmux/plugins/tmux-starship" \
   "run '~/.tmux/plugins/tpm/bin/install_plugins && tmux source-file ~/.tmux.conf'"

# needs to be at the bottom
run '~/.tmux/plugins/tpm/tpm'
